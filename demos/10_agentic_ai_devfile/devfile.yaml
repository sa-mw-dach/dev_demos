schemaVersion: 2.2.0
metadata:
  name: udi-agentic-ai
  displayName: Agentic AI Demo inside a Universal Developer Image
  description: A Universal Developer Image containing a demo about Agentic AI
  icon: https://raw.githubusercontent.com/devfile/devfile-web/main/apps/landing-page/public/pwa-192x192.png
  tags:
    - Java
    - Maven
    - ubi8
    - AgenticAI
    - LLM
  projectType: universal
  language: Polyglot
  version: 1.0.0
projects:
  - name: quarkus-drools-llm
    git:
      remotes:
        origin: 'https://github.com/manhah/quarkus-drools-llm.git'
      checkoutFrom:
        revision: bugfix/refund
components:
  - name: storageollama
    volume:
      size: 10Gi
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 6G
      memoryRequest: 512Mi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      sourceMapping: /projects
      volumeMounts:
        - name: storageollama
          path: /.ollama
  - name: ollama
    attributes:
      container-overrides:
        resources:
          limits:
            cpu: 8000m
            memory: 16Gi
            # nvidia.com/gpu: 1 # limiting to 1 GPU
          requests:
            cpu: 1000m
            memory: 8Gi
            # nvidia.com/gpu: 1 # requesting 1 GPU
    container:
      image: docker.io/ollama/ollama:latest
      mountSources: true
      sourceMapping: /.ollama
commands:
  - id: switchjavaversion
    exec:
      component: udi
      commandLine: "source $HOME/.bashrc && sdk install java 21.0.2-open"
  - id: runchatbot
    exec:
      component: udi
      commandLine: "./mvnw compile quarkus:dev"
events:
  postStart:
    - switchjavaversion
