schemaVersion: 2.2.0
metadata:
  name: udi-agentic-ai
  displayName: Agentic AI Demo inside a Universal Developer Image
  description: A Universal Developer Image containing a demo about Agentic AI
  icon: https://raw.githubusercontent.com/devfile/devfile-web/main/apps/landing-page/public/pwa-192x192.png
  tags:
    - Java
    - Maven
    - ubi8
    - AgenticAI
    - LLM
  projectType: universal
  language: Polyglot
  version: 1.0.0
projects:
  - name: quarkus-drools-llm
    git:
      remotes:
        origin: 'https://github.com/manhah/quarkus-drools-llm.git'
      checkoutFrom:
        revision: bugfix/refund
components:
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 6G
      memoryRequest: 512Mi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
commands:
  - id: switchtojava21
    exec:
      component: udi
      commandLine: "sdk install java 21.0.2-open"
events:
  postStart:
    - switchtojava21
